name: Deterministic validation

"on":
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  document-lint:
    name: Document lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: plugins/stray-studio/scripts/document-lint/package-lock.json
      - name: Install pinned lint dependencies
        run: npm ci --prefix plugins/stray-studio/scripts/document-lint --ignore-scripts --no-audit --no-fund
      - name: Test document checks
        run: npm test --prefix plugins/stray-studio/scripts/document-lint
      - name: Check tracked Markdown and text with common rules
        run: |
          python3 - <<'PY'
          import subprocess

          files = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.md", "*.txt"]
          ).decode().split("\0")
          subprocess.run(
              ["node", "plugins/stray-studio/scripts/document-lint/check.mjs",
               "--", *[path for path in files if path]],
              check=True,
          )
          PY
      - name: Check Japanese pilot documents (length is advisory)
        run: >-
          node plugins/stray-studio/scripts/document-lint/check.mjs --ja --
          docs/keiba-prediction-agent-skill-design.md
          plugins/stray-japan-govdocs/mcp/administrative-procedures-mcp/README.md
          plugins/stray-japan-govdocs/mcp/administrative-procedures-mcp/docs/dataset-yaml-guide.md
          plugins/stray-japan-govdocs/mcp/administrative-procedures-mcp/docs/development.md

  validate:
    name: JSON, YAML, routing, and script safety
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install deterministic dependencies
        run: >-
          python -m pip install
          --disable-pip-version-check
          --no-compile
          PyYAML==6.0.3
          pytest==9.1.1
          iniconfig==2.3.0
          packaging==26.2
          pluggy==1.6.0
          Pygments==2.20.0
          Pillow==12.3.0
          numpy==2.4.3

      - name: Reject tracked generated Python artifacts
        shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)__pycache__/|\.py[co]$' || true)"
          if [[ -n "$tracked" ]]; then
            printf 'Tracked generated Python artifacts are not allowed:\n'
            printf '%s\n' "$tracked"
            exit 1
          fi

      - name: Validate tracked JSON and YAML syntax
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path

          validator_dir = Path(
              "plugins/stray-skillops/skills/skill-routing-validator/scripts"
          ).resolve()
          sys.path.insert(0, str(validator_dir))
          from validate_routing_cases import load_unique_json, load_unique_yaml

          output = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.json", "*.yaml", "*.yml"]
          )
          paths = [Path(raw.decode()) for raw in output.split(b"\0") if raw]
          for path in paths:
              with path.open(encoding="utf-8") as handle:
                  if path.suffix == ".json":
                      load_unique_json(handle.read())
                  else:
                      load_unique_yaml(handle.read())
          print(f"structured-data-ok files={len(paths)}")
          PY

      - name: Validate routing structure
        run: >-
          python
          plugins/stray-skillops/skills/skill-routing-validator/scripts/validate_routing_cases.py

      - name: Run deterministic tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          plugins/stray-skillops/skills/skill-routing-validator/tests
          plugins/stray-studio/skills/corporate-site-builder/tests

  studio-platform:
    name: Studio filesystem safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONUTF8: "1"
      STRAY_REQUIRE_SYMLINKS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-compile
          pytest==9.1.1 iniconfig==2.3.0 packaging==26.2 pluggy==1.6.0
          Pygments==2.20.0 Pillow==12.3.0 numpy==2.4.3
      - name: Require symlink creation on the runner
        run: >-
          python -c "import pathlib, tempfile;
          d=tempfile.TemporaryDirectory(); p=pathlib.Path(d.name);
          (p/'link').symlink_to(p/'target'); (p/'link').unlink();
          (p/'dir-link').symlink_to(p/'target-dir', target_is_directory=True);
          (p/'dir-link').unlink(); d.cleanup()"
      - name: Test Studio scripts and platform permissions
        run: >-
          python -m pytest -q -rs -p no:cacheprovider
          plugins/stray-studio/skills/pixel-art-asset-creator/tests
          plugins/stray-studio/skills/change-readiness-review/tests
